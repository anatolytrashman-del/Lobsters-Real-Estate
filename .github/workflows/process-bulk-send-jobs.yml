name: Process bulk send jobs

# Расписания здесь больше нет. Владелец, 2026-09-11: "массовая рассылка должна
# работать сразу, а не через сутки" — очередь разбирает Supabase Edge Function
# process-bulk-send-jobs (supabase/functions/), её дёргает pg_cron раз в минуту,
# так что от постановки в очередь до первого письма проходит меньше минуты
# вместо пяти. Заодно это снимает последний крон `*/5` с бесплатного публичного
# репозитория — именно из-за трёх таких кронов GitHub затроттлил Actions
# аккаунта (см. docs/session-journal.md, 2026-09-11). Ручной запуск остаётся
# запасным путём: письмо захватывается атомарно, два пути не отправят одно
# письмо дважды.
on:
  workflow_dispatch:

concurrency:
  # Один прогон может идти по несколько минут (пауза между письмами внутри
  # самого скрипта) — не даём следующему тику крона стартовать поверх ещё
  # не завершившегося, иначе одно и то же письмо теоретически могло бы уйти
  # дважды. cancel-in-progress: false — ждём завершения текущего запуска,
  # не обрываем половину рассылки.
  group: process-bulk-send-jobs
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/process-bulk-send-jobs.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
