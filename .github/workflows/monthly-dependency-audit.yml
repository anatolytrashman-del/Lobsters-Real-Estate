name: Monthly dependency audit

# P2.3 аудита безопасности — процесс регулярного обзора уязвимостей
# зависимостей: раз в месяц гоняем npm audit, и если что-то нашлось —
# заводим/обновляем один issue со списком находок, чтобы владелец/сессия
# увидели это без необходимости запускать npm audit руками. Не пытается
# чинить сам (npm audit fix здесь не запускается) — среди известных находок
# на момент внедрения есть высокая уязвимость в xlsx без доступного фикса
# (см. комментарий в src/lib/materialLedgerXlsx.ts, почему она не применима
# к тому, как здесь используется библиотека) — автослияние тут не подходит,
# решение по каждой находке принимает человек.
on:
  schedule:
    # 5-го числа каждого месяца, утром UTC — не совпадает с другими
    # месячными cron задачами в этом репозитории (см. соседние workflow).
    - cron: '0 6 5 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run npm audit
        id: audit
        run: |
          npm audit --json > audit.json || true
          TOTAL=$(node -e "console.log(require('./audit.json').metadata?.vulnerabilities?.total ?? 0)")
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
      - name: Завести/обновить issue с находками
        if: steps.audit.outputs.total != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditJson = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const total = auditJson.metadata?.vulnerabilities?.total ?? 0;
            if (total === 0) return;

            const vulns = auditJson.vulnerabilities || {};
            const lines = Object.entries(vulns).map(([name, v]) => {
              const fix = v.fixAvailable
                ? (v.fixAvailable === true ? 'исправление доступно (`npm audit fix`)' : `исправление доступно (обновить до ${v.fixAvailable.name}@${v.fixAvailable.version})`)
                : 'исправления пока нет';
              return `- **${name}** — ${v.severity}, ${fix}`;
            });

            const title = 'npm audit: найдены уязвимости зависимостей';
            const body = [
              `Автоматическая ежемесячная проверка \`npm audit\` (workflow "Monthly dependency audit") нашла ${total} уязвимост${total === 1 ? 'ь' : 'ей'}:`,
              '',
              ...lines,
              '',
              'Полный JSON-отчёт — в логах последнего запуска workflow. Если находка уже разобрана и риск принят осознанно (как xlsx, см. комментарий в src/lib/materialLedgerXlsx.ts) — закрывать issue вручную, следующий месячный прогон переоткроет только если появится новая находка.',
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
