name: Process supplier web search jobs

# Расписания здесь БОЛЬШЕ НЕТ. 2026-09-11: GitHub перестал выдавать раннеры
# аккаунту (всё висело в queued, планировщик молчал) — при включённых Actions,
# чистом биллинге и зелёном статусе GitHub. Причина — троттлинг по fair use:
# на бесплатном публичном репозитории крутились ТРИ воркфлоу с кроном раз в 5
# минут (≈864 запуска в сутки, каждый с npm ci), валовая нагрузка за месяц
# ≈7700 минут раннеров. Очередь поставщиков переехала на Supabase (Edge
# Function process-supplier-jobs + pg_cron раз в минуту, см. supabase/functions),
# поэтому крон отсюда убран совсем. Ручной запуск остаётся — как запасной путь,
# если понадобится прогнать очередь именно раннером.
on:
  workflow_dispatch:

concurrency:
  # Один поиск — 2 раунда по 40-115с каждый (см. process-supplier-web-search-
  # jobs.mjs), на несколько заданий в очереди прогон может идти минуты — не
  # даём следующему тику стартовать поверх ещё не завершившегося.
  group: process-supplier-web-search-jobs
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/process-supplier-web-search-jobs.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROXYAPI_KEY: ${{ secrets.PROXYAPI_KEY }}
      # Владелец, 2026-09-11: "скрипт обогащения сразу берёт в работу" —
      # найденные поставщики создаются предложениями прямо в поисковом
      # скрипте выше и там же ставятся в очередь на обогащение, поэтому
      # обработчик очереди запускается тем же прогоном, а не ждёт своего
      # крона (тот остаётся страховкой, см. process-supplier-enrichment-jobs.yml).
      - run: node scripts/process-supplier-enrichment-jobs.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROXYAPI_KEY: ${{ secrets.PROXYAPI_KEY }}
