name: Compress static images (public/images)

# Разовый (запускается вручную) прогон scripts/compress-static-images.mjs —
# сжимает картинки, закоммиченные прямо в репозиторий (public/images/**:
# гид района, карточки бизнес-центров), через TinyPNG и коммитит результат
# обратно в ту же ветку. Манифест (scripts/data/tinypng-static-manifest.json)
# делает повторные запуски безопасными — уже сжатые файлы не трогаются
# заново, если их содержимое не поменялось.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/compress-static-images.mjs
        env:
          TINYPNG_API_KEY: ${{ secrets.TINYPNG_API_KEY }}
      - name: Commit compressed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images scripts/data/tinypng-static-manifest.json
          if git diff --cached --quiet; then
            echo "Нечего коммитить — все картинки уже сжаты"
          else
            git commit -m "Сжать статические картинки через TinyPNG"
            git push
          fi
