name: Sync citywide parking offers (Kufar)

on:
  schedule:
    # 3-го числа, тот же час, что и у розницы/складов (0 5 3 * *) — все три
    # скрипта независимы (разные категории Kufar), гонять их одновременно
    # безопасно.
    - cron: '0 5 3 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-citywide-parking-offers.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
