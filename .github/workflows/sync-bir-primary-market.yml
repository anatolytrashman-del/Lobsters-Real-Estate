name: Sync primary market (bir.by)

on:
  schedule:
    # Раз в месяц, 1-го числа — тот же принцип, что у
    # sync-market-offers-stats.yml (Kufar/Realt): рынок не меняется настолько
    # быстро, чтобы парсить чаще. Час сдвинут на час раньше (02:00 UTC против
    # 03:00 у Kufar/Realt) — просто чтобы не гонять оба скрейпа день в день
    # ровно в одну минуту, не обязательное требование.
    #
    # 2026-09-10: этот скрипт (scripts/sync-bir-primary-market.mjs)
    # существовал раньше, но не был подключён ни к одному расписанию —
    # первичка не обновлялась автоматически вовсе, только разовыми ручными
    # прогонами (владелец: "автоматически парсить рынок первички 1-го числа
    # и обновлять инфу").
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-bir-primary-market.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
