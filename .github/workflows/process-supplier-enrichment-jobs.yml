name: Process supplier enrichment jobs

on:
  schedule:
    # Каждые 5 минут — тот же принцип, что у process-supplier-web-search-
    # jobs.yml. Подстраховка на случай, если мгновенный workflow_dispatch
    # (см. api/trigger-rebuild.js, action:'dispatch-supplier-enrichment') не
    # сработал (нет токена/сетевая ошибка) — очередь всё равно разберётся сама.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  # Одно задание — до 3 вызовов web_fetch, на несколько заданий в очереди
  # (например, массовое "Обогатить всех поставщиков" на категорию) прогон
  # может идти какое-то время — не даём следующему тику стартовать поверх
  # ещё не завершившегося.
  group: process-supplier-enrichment-jobs
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/process-supplier-enrichment-jobs.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROXYAPI_KEY: ${{ secrets.PROXYAPI_KEY }}
