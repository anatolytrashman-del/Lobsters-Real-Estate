    <!-- Yandex.Metrika counter — ?prerender=1 в URL ставит только
         scripts/prerender.mjs при снятии build-time снапшота (SEO_PLAN.md,
         Э2-1): без этой проверки каждый деплой/пересборка слал бы в
         Метрику фантомные визиты с build-сервера. Реальные посетители на
         этот параметр никогда не попадают — открывают чистый /<slug>.

         PAGESPEED_PLAN.md, Э3 — сам tag.js (87 КиБ, ~800 мс CPU в отчёте
         PageSpeed) вставляется в DOM не сразу, а после полной загрузки
         страницы + паузы: очередь m[i].a копит вызовы ym(...) ниже
         независимо от того, успел ли уже прогрузиться сам скрипт — штатный
         механизм Метрики, инициализация (url/referrer/accurateTrackBounce)
         остаётся синхронной. Компромисс: визиты короче ~2 с (ушли раньше,
         чем скрипт успел встать в DOM) не досчитываются — владелец
         предупреждён, при текущем трафике это единицы в месяц. Вебвизор
         (запись сессий) выключен — владелец подтвердил, что не пользуется. -->
    <script type="text/javascript">
      if (location.search.indexOf('prerender=1') === -1) {
        (function (m, e, t, r, i, k, a) {
          m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments) };
          m[i].l = 1 * new Date();
          function insertTag() {
            for (var j = 0; j < document.scripts.length; j++) { if (document.scripts[j].src === r) { return; } }
            k = e.createElement(t), a = e.getElementsByTagName(t)[0], k.async = 1, k.src = r, a.parentNode.insertBefore(k, a);
          }
          if (document.readyState === 'complete') { setTimeout(insertTag, 2000); }
          else { window.addEventListener('load', function () { setTimeout(insertTag, 2000); }); }
        })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=111858495', 'ym');

        ym(111858495, 'init', { ssr: true, webvisor: false, clickmap: true, ecommerce: 'dataLayer', referrer: document.referrer, url: location.href, accurateTrackBounce: true, trackLinks: true });
      }
    </script>
    <!-- /Yandex.Metrika counter -->

    <!-- Top.Mail.Ru (VK Реклама / VK Ретаргетинг) pixel — тот же принцип
         отложенной вставки, что и у Метрики выше: window._tmr — просто
         массив-очередь (не сетевой вызов), pageView кладётся в него сразу
         (нужна точная метка времени), а сам code.js (сетевая нагрузка)
         вставляется в DOM только после полной загрузки страницы + паузы —
         не в критическом пути первой отрисовки. ?prerender=1 (build-time
         снапшот, см. Метрику выше) не должен слать фантомные события. -->
    <script type="text/javascript">
      if (location.search.indexOf('prerender=1') === -1) {
        var _tmr = window._tmr || (window._tmr = []);
        _tmr.push({ id: '3793248', type: 'pageView', start: (new Date()).getTime() });
        (function (d, w) {
          function insertTag() {
            if (d.getElementById('tmr-code')) { return; }
            var ts = d.createElement('script');
            ts.type = 'text/javascript';
            ts.async = true;
            ts.id = 'tmr-code';
            ts.src = 'https://top-fwz1.mail.ru/js/code.js';
            var s = d.getElementsByTagName('script')[0];
            s.parentNode.insertBefore(ts, s);
          }
          if (d.readyState === 'complete') { setTimeout(insertTag, 2000); }
          else { w.addEventListener('load', function () { setTimeout(insertTag, 2000); }); }
        })(document, window);
      }
    </script>
